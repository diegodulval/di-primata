[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["core", "auth", "utils", "producao", "oficinas"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
