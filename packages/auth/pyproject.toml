[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "di-mata-auth"
version = "0.1.0"
requires-python = ">=3.12"
description = "Autenticação e autorização JWT reutilizável"
dependencies = [
    "fastapi>=0.115.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
di-mata-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]
