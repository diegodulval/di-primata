[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "di-mata-core"
version = "0.1.0"
requires-python = ">=3.12"
description = "Modelos de domínio, repositórios e infraestrutura compartilhada"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "asyncpg>=0.29.0",
    "qrcode[pil]>=7.4.2",
    "pillow>=10.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
