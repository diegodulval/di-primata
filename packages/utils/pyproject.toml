[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "di-mata-utils"
version = "0.1.0"
requires-python = ">=3.12"
description = "Utilitários genéricos sem dependências de negócio"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/utils"]
