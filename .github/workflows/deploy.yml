name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Write .env
        run: |
          cat > /tmp/prod.env << 'EOF'
          APP_ENV=${{ secrets.APP_ENV }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          FRONTEND_URL=${{ secrets.FRONTEND_URL }}

          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}

          BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_SENHA=${{ secrets.BOOTSTRAP_ADMIN_SENHA }}
          BOOTSTRAP_ADMIN_NOME=${{ secrets.BOOTSTRAP_ADMIN_NOME }}
          BOOTSTRAP_ADMIN_WHATSAPP_PHONE=${{ secrets.BOOTSTRAP_ADMIN_WHATSAPP_PHONE }}

          TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM=${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_VALIDATE_SIGNATURE=${{ secrets.TWILIO_VALIDATE_SIGNATURE }}

          WHATSAPP_TOKEN=${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_VERIFY_TOKEN=${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_PHONE_ID=${{ secrets.WHATSAPP_PHONE_ID }}

          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

          DEBOUNCE_WINDOW_SECONDS=2.0
          RATE_LIMIT_MAX=10
          RATE_LIMIT_WINDOW=60
          EOF
          sed -i 's/^[[:space:]]*//' /tmp/prod.env
          scp /tmp/prod.env ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/app/.env
          rm /tmp/prod.env

      - name: Clone or pull repo
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            git config --global --add safe.directory /app
            mkdir -p /app
            if git -C /app remote get-url origin > /dev/null 2>&1; then
              git -C /app fetch origin main
              git -C /app reset --hard origin/main
            else
              rm -rf /app/.git
              git -C /app init
              git -C /app remote add origin https://github.com/diegodulval/di-primata.git
              git -C /app fetch origin main
              git -C /app checkout -fB main origin/main
            fi
          "

      - name: Build and restart
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /app &&
            docker compose -f docker-compose.prod.yml build --no-cache &&
            docker compose -f docker-compose.prod.yml up -d &&
            docker image prune -f
          "

      - name: Run migrations
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd /app &&
            docker compose -f docker-compose.prod.yml --profile migrate run --rm migrations
          "
