[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oficinas"
version = "0.1.0"
requires-python = ">=3.12"
description = "App de gerenciamento de oficinas mecânicas e auto peças"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "structlog>=24.0.0",
    "anthropic>=0.40.0",
    "httpx[socks]>=0.27.0",
    "socksio>=1.0.0",
    "di-mata-core",
    "di-mata-utils",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
di-mata-core = { workspace = true }
di-mata-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/oficinas"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/oficinas/modules", "src/oficinas/agente", "src/oficinas/shared"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["oficinas"]
omit = ["src/oficinas/__init__.py"]
