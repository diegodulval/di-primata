[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "producao"
version = "0.1.0"
requires-python = ">=3.12"
description = "App de rastreabilidade de cadeia produtiva"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "twilio>=9.0.0",
    "di-mata-core",
    "di-mata-auth",
    "di-mata-utils",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[tool.uv.sources]
di-mata-core = { workspace = true }
di-mata-auth = { workspace = true }
di-mata-utils = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/producao"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["producao"]
omit = ["src/producao/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 70
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
